---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <style>
        /* Simple Apple-style design */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #86868b; margin-bottom: 30px; }
        
        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin: 10px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        
        .btn-primary { background-color: #007aff; color: white; }
        .btn-secondary { background-color: #e8e8ed; color: #1d1d1f; }

        .footer-links { margin-top: 30px; font-size: 12px; }
        .footer-links a { color: #86868b; text-decoration: none; margin: 0 10px; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h1>{{ site.title }}</h1>
        <p>Welcome to the official support page.</p>

        <a href="{{ site.issues_url }}" class="btn btn-primary" target="_blank">
            🐞 Report a Bug
        </a>

        <a href="mailto:{{ site.email }}" class="btn btn-secondary">
            ✉️ Contact Support
        </a>

        <div class="footer-links">
            <a href="{{ site.baseurl }}/privacy/">Privacy Policy</a>
            <span>•</span>
            <a href="{{ site.github.repository_url }}">View on GitHub</a>
        </div>
    </div>

</body>
</html>
